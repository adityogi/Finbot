<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Financial Health Assessment</title>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link rel="stylesheet" href="static/styles.css">
</head>
<body>

<header>
  <nav class="nav-links">
    <a href="/" class="nav-link">New Assessment</a>
    <a href="/history" class="nav-link">History</a>
  </nav>
  <h1><i class="fas fa-chart-line"></i> Financial Health Assessment</h1>
</header>

<form method="POST" id="assessment-form">

  <!-- Section 1 -->
  <fieldset id="section-1" class="form-section active">
    <legend><i class="fas fa-info-circle"></i> Basic Information</legend>

    <label>Monthly Income (₹) <input type="number" name="monthly_income" required></label>

    <label>Savings Percentage (%) 
      <input type="number" name="savings_percentage" required min="0" max="100">
      <small>Aim for at least 20%</small>
    </label>

    <label>Emergency Fund 
      <select name="emergency_fund" required>
        <option value="yes">Yes</option><option value="no">No</option>
      </select>
      <small>Should cover 3–6 months of expenses</small>
    </label>

    <h3><i class="fas fa-globe"></i> Region</h3>
    <div class="economic-indicators">
      <div><strong>Inflation:</strong> <span id="inflation-rate">5.6%</span></div>
      <div><strong>Avg. Income:</strong> <span id="average-income">₹1,74,984</span></div>
      <div><strong>Interest:</strong> <span id="interest-rate">6.5%</span></div>
    </div>

    <h3><i class="fas fa-piggy-bank"></i> Investments & Loans</h3>
    <label>Invested?
      <select name="funds_invested" id="funds_invested" required>
        <option value="yes">Yes</option><option value="no">No</option>
      </select>
    </label>

    <div id="investment_options">
      <label>Investment Type
        <select name="investment_type">
          <option value="mixed">Mixed</option>
          <option value="stocks">Stocks</option>
          <option value="bonds">Bonds</option>
          <option value="mutual_funds">Mutual Funds</option>
          <option value="real_estate">Real Estate</option>
        </select>
      </label>

      <label>Expected Return (%) 
        <input type="number" name="expected_return" step="0.1" value="0">
      </label>
    </div>

    <label>Monthly Expense Variance (₹)
      <input type="number" name="monthly_variance" required>
    </label>

    <label>Loans?
      <select name="has_loans" id="has_loans" required>
        <option value="no">No</option><option value="yes">Yes</option>
      </select>
    </label>

    <div id="loan_fields">
      <label>Monthly Loan Payment (₹) <input type="number" name="monthly_loan_payment"></label>
      <label>Outstanding Loan Amount (₹) <input type="number" name="outstanding_loan"></label>
    </div>

    <div class="form-navigation">
      <button type="button" onclick="nextSection()">Next <i class="fas fa-arrow-right"></i></button>
    </div>
  </fieldset>

  <!-- Section 2 -->
  <fieldset id="section-2" class="form-section">
    <legend><i class="fas fa-money-check-alt"></i> Monthly Budget (Optional)</legend>

    <p>Provide a breakdown if you want more detailed analysis.</p>

    <label><i class="fas fa-home"></i> Housing
      <input type="number" name="housing" value="0">
    </label>
    <label><i class="fas fa-car"></i> Transport
      <input type="number" name="transportation" value="0">
    </label>
    <label><i class="fas fa-utensils"></i> Food
      <input type="number" name="food" value="0">
    </label>
    <label><i class="fas fa-lightbulb"></i> Utilities
      <input type="number" name="utilities" value="0">
    </label>
    <label><i class="fas fa-medkit"></i> Healthcare
      <input type="number" name="healthcare" value="0">
    </label>
    <label><i class="fas fa-film"></i> Entertainment
      <input type="number" name="entertainment" value="0">
    </label>
    <label><i class="fas fa-tshirt"></i> Personal
      <input type="number" name="personal" value="0">
    </label>
    <label><i class="fas fa-ellipsis-h"></i> Other
      <input type="number" name="other" value="0">
    </label>

    <div class="form-navigation">
      <button type="button" onclick="prevSection()"><i class="fas fa-arrow-left"></i> Back</button>
      <button type="submit" class="calculate-button"><i class="fas fa-calculator"></i> Calculate</button>
    </div>
  </fieldset>

</form>

<script>
function toggleVisibility(selectId, targetId, showValue="yes") {
  const select = document.getElementById(selectId);
  const target = document.getElementById(targetId);
  target.style.display = (select.value === showValue) ? "block" : "none";
}

function nextSection() {
  document.getElementById('section-1').classList.remove('active');
  document.getElementById('section-2').classList.add('active');
  window.scrollTo(0,0);
}

function prevSection() {
  document.getElementById('section-2').classList.remove('active');
  document.getElementById('section-1').classList.add('active');
  window.scrollTo(0,0);
}

// Init
window.onload = () => {
  toggleVisibility('has_loans','loan_fields');
  toggleVisibility('funds_invested','investment_options');
  document.getElementById('has_loans').onchange=()=>toggleVisibility('has_loans','loan_fields');
  document.getElementById('funds_invested').onchange=()=>toggleVisibility('funds_invested','investment_options');
};
</script>

</body>
</html>
